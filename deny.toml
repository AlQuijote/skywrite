# cargo-deny policy: https://embarkstudios.github.io/cargo-deny/
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # Dated exceptions, expiring 2027-01-18. object_store =0.14.2 (latest; chrono and
    # humantime are unconditional deps) has no release without them. Drop each entry
    # once object_store moves off the crate (apache/arrow-rs-object-store#909, #908)
    # or at expiry, whichever comes first.
    { id = "RUSTSEC-2026-0543", reason = "chrono: unmaintained, required by object_store 0.14.2; expires 2027-01-18, drop when object_store drops it (arrow-rs-object-store#909)." },
    { id = "RUSTSEC-2026-0542", reason = "humantime: unmaintained, required by object_store 0.14.2; expires 2027-01-18, drop when object_store drops it (arrow-rs-object-store#908)." },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "IJG",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "BSL-1.0",
    "0BSD",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    # File-level copyleft. Only cssparser, cssparser-macros, dtoa-short and selectors
    # (via takumi), used unmodified; their source is published on crates.io and
    # their license text ships in THIRD_PARTY_LICENSES.html.
    "MPL-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
